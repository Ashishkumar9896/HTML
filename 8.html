<!DOCTYPE html>
<html>
    <head>
        <title>HTML PRACTICE</title>
        <style>
            *{
                font-family: cursive;
            }
            h1,h2,h3{
                color: tomato;
                border: 0.1svw solid blue;
                margin: 60px;
                padding: 20px;
                word-spacing: 10px;
                text-transform: capitalize;
            
            }
            h4{
                color: green;
                border: 0.1svw solid red;
                word-spacing: 10px;
                margin: 50px;
                text-transform: uppercase;
                padding: 20px;
            }
            p{
                color: purple;
                border: 0.1svw solid orange;

            }
        </style>
    </head>
    <body>
        <h1>Welcome to HTML Practice</h1>
        <p>This is a simple HTML document for practice purposes.</p>
        <h2>this is h2 heading 2</h2>
        <h3>this is h3 heading 3</h3>
        <h4>this is h4 heading 4</h4>
        <p>this is paragraph</p>
    </body>
</html>
