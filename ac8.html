<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: white;
        }
        .main {
            border: 3px solid black;
            border-radius: 40px;
            padding: 20px;
            background-color: white;
            width: 550px;
        }
        .outer {
            border: 3px dotted black;
            border-radius: 30px;
            padding: 20px 25px;
            text-align: center;
        }
        .title {
            display: inline-block;
            border: 2px solid black;
            border-radius: 10px;
            padding: 1px 150px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 17px;

        }
        .inner {
            border: 2px dashed black;
            border-radius: 0px;
            padding: 20px;
            background-color: white;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: separate;
            border-spacing: 2px;
            text-align: center;
        }
        th, td {
            border: 2px solid black;
            padding: 12px;
            height: 50px; 
        }
        th + th, td + td {
            border-left: 4px d black;
        }
        tbody td {
            border-top: none;
            border-bottom: none;
            border-width: 4px;
        }
        .inner table {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
  <div class="main">
    <div class="outer">
      <div class="title"><h1>Marks table</h1></div>
      <div class="inner">
        <table>
          <thead>
            <tr>
              <th>student</th>
              <th>Maths</th>
              <th>Physics</th>
              <th>Internet<br>Programming</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Ashish</td>
              <td>99</td>
              <td>92</td>
              <td>73</td>
            </tr>
            <tr>
              <td>Alice</td>
              <td>54</td>
              <td>32</td>
              <td>23</td>
            </tr>
            <tr>
              <td>Bhavishya</td>
              <td>54</td>
              <td>92</td>
              <td>53</td>
            </tr>
            <tr>
              <td>Retish</td>
              <td>87</td>
              <td>39</td>
              <td>63</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
